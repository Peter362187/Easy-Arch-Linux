# =============================================================================
# Wizard-Schritt 6b: Treiber
#
# Diese Kategorie existiert vor allem als Beleg dafuer, dass "neue Optionen ohne
# Codeaenderung" (Spec Abschnitt 17) tatsaechlich funktioniert: die Datei wurde
# nach der GUI angelegt und erscheint allein durch ihre Existenz im Wizard.
#
# Mesa ist Vorgabe, weil es fuer AMD und Intel der richtige Treiber ist und
# unter NVIDIA als Fallback nicht schadet.
# =============================================================================

schema_version: 1

category:
  id: drivers
  title: "Grafiktreiber"
  icon: "driver"
  subtitle: "Treiber fuer die Grafikkarte des Zielsystems."
  step: 65
  page_type: selection
  selection_mode: multi
  layout: cards
  columns: 2
  visible_when:
    any_of: ["cap:graphical-session"]

options:

  - id: mesa
    order: 10
    label: "Mesa (AMD / Intel)"
    description: >-
      Offene Treiber fuer AMD- und Intel-Grafik. Auch bei NVIDIA sinnvoll als
      Grundlage.
    default: true
    recommended: true
    packages:
      - mesa
      - vulkan-icd-loader
    semantics:
      profile_config.gfx_driver: "All open-source"

  - id: mesa-32
    order: 15
    label: "32-Bit-Grafikbibliotheken"
    description: "Noetig fuer Steam, Wine und aeltere 32-Bit-Spiele."
    packages:
      - lib32-mesa
      - lib32-vulkan-icd-loader
    repos: [multilib]
    requires: [drivers.mesa]

  - id: nvidia
    order: 20
    label: "NVIDIA (proprietaer)"
    description: >-
      Proprietaerer NVIDIA-Treiber. Die Variante richtet sich nach dem gewaehlten
      Kernel und wird automatisch passend gesetzt.
    packages:
      - name: nvidia
        when: "kernel.linux"
        reason: "Treibermodul fuer den Standard-Kernel"
      - name: nvidia-lts
        when: "kernel.linux-lts"
        reason: "Treibermodul fuer den LTS-Kernel"
      - name: nvidia-dkms
        when: "kernel.linux-zen"
        reason: "Zen hat kein vorgebautes Modul, deshalb DKMS"
      - nvidia-utils
      - nvidia-settings
    semantics:
      profile_config.gfx_driver: "Nvidia (proprietary)"

  - id: intel-media
    order: 30
    label: "Intel-Videobeschleunigung"
    description: "VA-API-Treiber fuer Intel-Grafik (Videodekodierung in Hardware)."
    packages:
      - intel-media-driver
      - libva-utils

  - id: amd-vulkan
    order: 40
    label: "AMD Vulkan (RADV)"
    description: "Vulkan-Unterstuetzung fuer AMD-Grafikkarten."
    packages:
      - vulkan-radeon
    requires: [drivers.mesa]

  - id: printing
    order: 50
    label: "Druckerunterstuetzung"
    description: "CUPS mit automatischer Druckererkennung im Netzwerk."
    packages:
      - cups
      - cups-pdf
      - system-config-printer
    services:
      - unit: cups.service
        scope: system
        action: enable
        wanted_by: [multi-user.target]
        owned_by: drivers.printing
        package: cups
    semantics:
      app_config.print_service_config.print_service: "cups"
