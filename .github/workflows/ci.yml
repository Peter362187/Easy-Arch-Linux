name: Tests

# Der Rechner, auf dem entwickelt wird, ist ein Windows-Notebook. Ob der Code
# auch unter Linux und macOS und mit aelteren Python-Fassungen laeuft, war
# bisher eine Vermutung -- die Pfadlogik, die Rechtebits der Dateisenken und
# die Subprozess-Aufrufe sind genau die Stellen, an denen sich Plattformen
# unterscheiden.
#
# Gebaut wird hier nie eine ISO: mkarchiso braucht Arch und root, und ein Lauf
# dauert eine halbe Stunde. Die Tests kommen ohne aus.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ein neuer Push macht den laufenden Lauf ueberfluessig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Qt-Systembibliotheken (nur Ubuntu)
        if: runner.os == 'Linux'
        # Das offscreen-Plugin von Qt braucht trotzdem ein paar X-Bibliotheken.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Abhaengigkeiten
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          ARCHCUSTOMISER_MOTION: "off"
        run: python -m pytest -q

      - name: Kommandozeile
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          # --check-env meldet 1, wenn hier nicht gebaut werden kann -- das ist
          # auf einem Runner der Normalfall und kein Fehler.
          python -m archcustomiser --check-env || true
          python -m archcustomiser --dry-run src/archcustomiser/profiles/minimal.yaml --offline
          python -m archcustomiser --export-profile src/archcustomiser/profiles/minimal.yaml \
            --out "${RUNNER_TEMP}/profil.tar.gz"
          python -m archcustomiser --history

  lint:
    name: ruff und mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python -m mypy src/archcustomiser

  qt-frei:
    name: core bleibt ohne Qt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Bewusst ohne PySide6 installiert: waere Qt da, koennte ein versehentlicher
      # Import in core/ unbemerkt durchgehen.
      - run: python -m pip install --upgrade pip && python -m pip install pyyaml jinja2
      - name: Kern importieren
        run: |
          PYTHONPATH=src python - <<'PY'
          import sys
          import archcustomiser.core.catalog
          import archcustomiser.core.resolver
          import archcustomiser.core.plan
          import archcustomiser.core.packages
          import archcustomiser.core.profiles
          import archcustomiser.core.validation
          import archcustomiser.core.archiso
          import archcustomiser.core.build
          import archcustomiser.core.history
          import archcustomiser.core.build.verify
          qt = [name for name in sys.modules if name.startswith("PySide6")]
          assert not qt, f"core zieht Qt herein: {qt}"
          print("core ist Qt-frei")
          PY
