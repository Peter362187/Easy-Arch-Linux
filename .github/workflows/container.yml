# Prueft den Container-Bauweg auf einem echten Ubuntu.
#
# Warum es diesen Ablauf zusaetzlich zu ci.yml gibt: dort laufen die Tests --
# hier laeuft ein echter Container. Das ist ein Unterschied, der sich am
# 07.09.2026 als teuer erwiesen hat. Die Testsammlung deckt die *Form* der
# Aufrufe lueckenlos ab und ihre *Wirkung* ueberhaupt nicht; vier Fehler
# ueberlebten deshalb jahrelang, darunter zwei, die den Weg vollstaendig
# unmoeglich machten.
#
# Bewusst NUR auf Knopfdruck. Ein Abbildbau laedt hunderte MB, ein ISO-Bau
# dauert eine halbe Stunde -- das gehoert nicht an jeden Push.
#
#   Actions -> "Container-Bauweg pruefen" -> "Run workflow"

name: Container-Bauweg pruefen

on:
  workflow_dispatch:
    inputs:
      umfang:
        description: "Wie gruendlich?"
        type: choice
        default: pruefung
        options:
          - pruefung        # Abbild, Einhaengungen, pacstrap -- rund 6 Minuten
          - iso             # zusaetzlich eine vollstaendige ISO -- rund 30 Minuten
      engine:
        description: "Welche Container-Engine?"
        type: choice
        default: docker
        options:
          - docker          # auf dem Runner rootful -- der Weg, der traegt
          - podman          # auf dem Runner rootless -- soll sauber abgewiesen werden

permissions:
  contents: read

jobs:
  pruefung:
    name: Container-Weg (${{ inputs.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        # Ohne PySide6: geprueft wird der Kern, und der ist Qt-frei.
        run: python -m pip install --upgrade pip PyYAML Jinja2

      - name: Was dieser Runner mitbringt
        run: |
          df -h /
          docker --version || echo "kein docker"
          podman --version || echo "kein podman"
          id

      - name: Was das Programm ueber beide Engines sagt
        # Eine Auskunft, keine Pruefung -- deshalb nie fehlschlagend.
        # Aufschlussreich ist der Unterschied: docker laeuft auf dem Runner
        # rootful, podman rootless. Genau diese Unterscheidung kam bis zum
        # 07.09.2026 gar nicht an, weil die Frage in podman-Vokabular gestellt
        # wurde und docker sie mit einem Fehler quittierte.
        continue-on-error: true
        run: |
          for e in docker podman; do
            echo "=== $e ==="
            PYTHONPATH=src python -c "
          import archcustomiser.core.build.container as c
          c.find_engine = lambda: '$e'
          s = c.detect()
          for feld in ('engine', 'version', 'rootless', 'usable', 'problem'):
              print(f'  {feld:9}', getattr(s, feld))
          "
          done

      - name: Sprossen 0 bis 2 -- Abbild, Einhaengungen, pacstrap
        run: PYTHONPATH=src python tools/containerprobe.py --engine ${{ inputs.engine }}

  iso:
    name: Vollstaendige ISO im Container
    runs-on: ubuntu-24.04
    if: inputs.umfang == 'iso'
    needs: pruefung
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python -m pip install --upgrade pip PyYAML Jinja2

      - name: Platz schaffen
        # Die Vorabpruefung verlangt 8 GB (BASE_WORK_GB); der Runner bringt
        # rund 22 GB mit, aber Abbild und pacman-Zwischenspeicher kommen dazu.
        # Die vorinstallierten SDKs braucht hier niemand.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: ISO bauen
        # Ueber die offizielle Kommandozeile, nicht ueber ein Hilfsskript:
        # geprueft werden soll der Weg, den auch ein Benutzer nimmt.
        run: |
          mkdir -p "$HOME/acbau/work" "$HOME/acbau/out"
          PYTHONPATH=src python -m archcustomiser \
            --build src/archcustomiser/profiles/minimal.yaml \
            --target container \
            --work-dir "$HOME/acbau/work" --out-dir "$HOME/acbau/out"

      - name: Was dabei herauskam
        if: always()
        run: ls -la "$HOME/acbau/out/" || true

      - name: ISO pruefen
        run: |
          PYTHONPATH=src python -m archcustomiser \
            --verify-iso "$HOME"/acbau/out/*.iso

      - name: ISO mitnehmen
        uses: actions/upload-artifact@v4
        with:
          name: iso-container-${{ inputs.engine }}
          path: ~/acbau/out/*.iso
          retention-days: 5
          if-no-files-found: error
