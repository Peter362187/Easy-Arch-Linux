# Prueft den Container-Bauweg auf einem echten Ubuntu.
#
# Warum es diesen Ablauf gibt: der Container ist der einzige der drei Bauwege,
# der nicht auf dem Rechner des Autors laufen kann -- dort ist Windows mit
# einer WSL-Arch-Verteilung. Bis zum 07.09.2026 war er deshalb "durch Tests
# belegt, aber nie auf einem echten System gelaufen", und genau darin
# versteckten sich vier Fehler, die Attrappentests nicht finden konnten.
#
# Bewusst NUR auf Knopfdruck (workflow_dispatch). Nichts laeuft automatisch:
# ein voller ISO-Bau dauert eine halbe Stunde, und niemand soll dafuer
# bezahlen, nur weil ein Komma verschoben wurde.
#
#   Actions -> "Container-Bauweg pruefen" -> "Run workflow"

name: Container-Bauweg pruefen

on:
  workflow_dispatch:
    inputs:
      umfang:
        description: "Wie gruendlich?"
        type: choice
        default: pruefung
        options:
          - pruefung        # Abbild, Einhaengungen, pacstrap -- rund 6 Minuten
          - iso             # zusaetzlich eine vollstaendige ISO -- rund 30 Minuten
          - nur-tests       # nur die Testsammlung auf echtem Linux
      engine:
        description: "Welche Container-Engine?"
        type: choice
        default: docker
        options:
          - docker          # auf dem Runner rootful -- der Weg, der traegt
          - podman          # auf dem Runner rootless -- soll sauber abgewiesen werden

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Die Testsammlung auf echtem Linux. Zwei Tests werden unter Windows
  # uebersprungen und sind dort noch nie gelaufen.
  # -------------------------------------------------------------------------
  tests:
    name: Tests auf Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        # Bewusst ohne PySide6: das Paket ist gross, braucht Qt-Systembibliotheken,
        # und die Oberflaechentests ueberspringen sich selbst, wenn es fehlt
        # (pytest.importorskip in tests/test_gui.py). Geprueft wird hier der Kern.
        run: python -m pip install --upgrade pip PyYAML Jinja2 pytest

      - name: Testsammlung
        run: PYTHONPATH=src python -m pytest -q

  # -------------------------------------------------------------------------
  # Sprossen 0 bis 2: Abbild bauen, Einhaengungen pruefen, pacstrap.
  # Ueber den Code des Programms, nicht ueber nachgebaute Befehle.
  # -------------------------------------------------------------------------
  pruefung:
    name: Container-Weg (${{ inputs.engine }})
    runs-on: ubuntu-24.04
    if: inputs.umfang != 'nur-tests'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python -m pip install --upgrade pip PyYAML Jinja2

      - name: Was dieser Runner mitbringt
        run: |
          df -h /
          echo "---"
          docker --version || echo "kein docker"
          podman --version || echo "kein podman"
          id

      - name: Was das Programm ueber beide Engines sagt
        # Nie fehlschlagend: das ist eine Auskunft, keine Pruefung. Interessant
        # ist vor allem, dass podman hier rootless laeuft und docker nicht --
        # genau die Unterscheidung, die bis zum 07.09.2026 gar nicht ankam,
        # weil die Rootless-Frage in podman-Vokabular gestellt wurde.
        continue-on-error: true
        run: |
          for e in docker podman; do
            echo "=== $e ==="
            PYTHONPATH=src python -c "
          from archcustomiser.core.build.container import ContainerTarget, detect
          import archcustomiser.core.build.container as c
          c.find_engine = lambda: '$e'
          s = detect()
          print(' engine  ', s.engine)
          print(' version ', s.version)
          print(' rootless', s.rootless)
          print(' usable  ', s.usable)
          print(' problem ', s.problem or '(keines)')
          "
          done

      - name: Sprossen 0 bis 2
        run: PYTHONPATH=src python tools/containerprobe.py --engine ${{ inputs.engine }}

  # -------------------------------------------------------------------------
  # Sprosse 4: eine vollstaendige ISO ueber dieselbe Schnittstelle, die auch
  # der Knopf "ISO erstellen" benutzt.
  # -------------------------------------------------------------------------
  iso:
    name: Vollstaendige ISO im Container
    runs-on: ubuntu-24.04
    if: inputs.umfang == 'iso'
    needs: pruefung
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python -m pip install --upgrade pip PyYAML Jinja2

      - name: Platz schaffen
        # Die Vorabpruefung verlangt 8 GB (BASE_WORK_GB); der Runner bringt
        # rund 22 GB mit, aber das Abbild und der pacman-Zwischenspeicher
        # kommen dazu. Die vorinstallierten SDKs braucht hier niemand.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: ISO bauen
        run: |
          mkdir -p "$HOME/acbau/work" "$HOME/acbau/out"
          PYTHONPATH=src python tools/echtbau.py \
            src/archcustomiser/profiles/minimal.yaml "$HOME/fortschritt.json" \
            --ziel container --engine ${{ inputs.engine }} \
            --arbeit "$HOME/acbau/work" --ausgabe "$HOME/acbau/out"

      - name: Was dabei herauskam
        if: always()
        run: |
          cat "$HOME/fortschritt.json" || true
          echo
          ls -la "$HOME/acbau/out/" || true
          tail -60 "$HOME/fortschritt.ausgabe.log" || true

      - name: ISO mitnehmen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iso-container-${{ inputs.engine }}
          path: ~/acbau/out/*.iso
          retention-days: 5
          if-no-files-found: error
